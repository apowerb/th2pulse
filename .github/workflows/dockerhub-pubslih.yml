name: Build and publish Docker image

on:
  workflow_run:
    workflows: ["Upload Python Package"]
    types: [completed]
  # Republier l'image d'une release deja sur PyPI -- typiquement apres une
  # correction qui ne touche que le Dockerfile, comme le passage a Debian 13.
  # Sans cela, un correctif de base ne peut pas atteindre l'image publiee : il
  # faudrait couper une release applicative pour livrer un changement qui n'en
  # est pas une.
  workflow_dispatch:
    inputs:
      version:
        description: "Version deja publiee sur PyPI a reconstruire, par ex. 0.1.4"
        required: true
      publish:
        description: "Pousser l'image sur Docker Hub. Decocher pour un essai qui construit et teste seulement."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  dockerhub-publish:
    # En workflow_run, on n'enchaine que sur une publication PyPI reussie.
    # En dispatch, il n'y a pas de run amont a juger.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    services:
      # Only used by the smoke test below, which needs a database to get
      # past application startup and answer /healthz.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version from the PyPI workflow tag
        id: release
        shell: bash
        env:
          # Passed as an env var (not interpolated into the script body) so an
          # attacker-controlled branch/tag name can't break out of the string
          # and inject arbitrary shell commands into this step.
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          # Pour lire la release la plus recente dans le script ci-dessous.
          GH_TOKEN: ${{ github.token }}
        run: |
          # En dispatch, la version est donnee explicitement ; head_branch n'a
          # alors aucun sens. Le controle de format ci-dessous s'applique aux
          # deux chemins : une saisie manuelle se trompe aussi bien qu'un tag.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${DISPATCH_VERSION#v}"
          else
            VERSION="${HEAD_BRANCH#v}"
          fi
          # head_branch is the only place this workflow can read the release
          # tag from, and for a workflow_run event it is not guaranteed to be
          # one: it can carry a branch name instead. That used to cost a
          # mislabelled tag; it now decides what the image actually installs
          # (TH2PULSE_VERSION below), and a non-version value would burn the
          # 15-minute PyPI wait before failing. Fail here instead, saying why.
          # [[ =~ ]] rather than grep: grep anchors per line, so a value
          # with an embedded newline would slip through on its first line.
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([abrc.dev+-][0-9A-Za-z.+-]*)?$ ]]; then
            echo "::error::Resolved '${VERSION}' from the ${{ github.event_name }} event, which is not a release version. Expected something like 0.1.4."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Faut-il faire suivre :latest ? Sur un workflow_run, oui : c'est une
          # vraie release. Sur un dispatch, seulement si la version reconstruite
          # EST deja la plus recente publiee -- reconstruire 0.1.2 ne doit pas
          # faire reculer :latest, mais reconstruire la derniere sur une base
          # corrigee doit le faire suivre, sinon `docker pull` sans tag continue
          # de servir l'image d'avant. Vecu le 11/09/2026 : une release coupee
          # pendant qu'un correctif etait en vol a laisse :latest sur l'image
          # vulnerable, la version corrigee etant publiee juste a cote.
          #
          # En cas de doute -- appel API en echec, aucune release -- on ne bouge
          # pas :latest : ne rien faire est le comportement sur.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "move_latest=true" >> "$GITHUB_OUTPUT"
          else
            NEWEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || echo "")
            NEWEST="${NEWEST#v}"
            if [ -n "${NEWEST}" ] && [ "${NEWEST}" = "${VERSION}" ]; then
              echo "move_latest=true" >> "$GITHUB_OUTPUT"
              echo "${VERSION} est la release la plus recente : :latest suivra."
            else
              echo "move_latest=false" >> "$GITHUB_OUTPUT"
              echo "release la plus recente = '${NEWEST:-inconnue}', demandee = '${VERSION}' : :latest ne bouge pas."
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Same interpreter as the Dockerfile's base image, so the wait step
          # below resolves against the same set of wheels the build will.
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      # This workflow starts as soon as "Upload Python Package" reports
      # success, but PyPI's index takes some time to propagate a freshly
      # published release. The Docker build below installs
      # "th2pulse[ingest]==${VERSION}" straight from PyPI, so building
      # immediately is a race: the resolver reports "Because there is no
      # version of th2pulse==X and you require th2pulse==X, we can conclude
      # that your requirements are unsatisfiable". Cutting 0.1.2 by hand hit
      # exactly that, and a retry a minute later resolved.
      #
      # This step runs the same resolution the Dockerfile runs, so it fails
      # and succeeds under exactly the condition the real build depends on.
      # Polling PyPI's JSON metadata endpoint instead would check a different
      # code path than the Simple index the resolver reads, and could report
      # "available" before the resolver agrees.
      - name: Wait for the release to resolve on PyPI
        shell: bash
        env:
          # Same requirement string the Dockerfile installs, extras
          # included, so this step resolves exactly what the build will.
          PACKAGE_NAME: th2pulse[ingest]
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: .github/scripts/wait-for-pypi-release.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Built for this runner's architecture only, and loaded rather than
      # pushed, so the next step can run it. The multi-arch build below
      # reuses these layers from cache, so this is not a second full build.
      - name: Build image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          build-args: |
            TH2PULSE_VERSION=${{ steps.release.outputs.version }}
          tags: th2pulse:smoke

      # The step that was missing. Nothing in this pipeline used to run the
      # image it publishes, so 0.1.2 shipped unable to start at all: the
      # build passing was read as the release working.
      - name: Smoke-test the image before publishing it
        env:
          IMAGE: th2pulse:smoke
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          DB_DSN: postgresql://postgres:smoke@127.0.0.1:5432/smoke
        run: .github/scripts/smoke-test-image.sh

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Un enchainement sur release pousse toujours ; un dispatch obeit a
          # sa case. L'essai a blanc construit et passe le smoke test sans
          # rien publier.
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            TH2PULSE_VERSION=${{ steps.release.outputs.version }}
          # :latest seulement pour une vraie release. Un workflow_dispatch
          # d'une version anterieure -- reconstruire 0.1.2 sur une base
          # corrigee, par exemple -- ferait sinon RECULER :latest, et toute
          # installation qui ne fixe pas le tag suivrait la descente sans le
          # moindre signal. Corrige un defaut de la PR #8, qui avait repris le
          # declencheur de th2etl sans reprendre cette garde.
          tags: |
            apowerb/th2pulse:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.move_latest == 'true' && 'apowerb/th2pulse:latest' || '' }}
